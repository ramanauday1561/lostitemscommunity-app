name: Checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Generated DB types are current (optional)
        # Compares src/lib/database.types.ts with the live schema. Needs a
        # SUPABASE_ACCESS_TOKEN secret (skipped when absent) and never blocks:
        # a mismatch shows as a warning so a formatting difference between
        # generator versions can't fail an unrelated PR. To fix, re-run
        # `npm run gen:types` (or the MCP generate_typescript_types tool).
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "No SUPABASE_ACCESS_TOKEN; skipping."; exit 0; fi
          npx --yes supabase gen types typescript --project-id tqkmpirusmdckccqfxyd > /tmp/types.ts
          if ! diff <(tail -n +5 src/lib/database.types.ts | grep -v '^\s*$') <(grep -v '^\s*$' /tmp/types.ts); then
            echo "::warning::src/lib/database.types.ts is out of date with the live schema. Run npm run gen:types."
            exit 1
          fi
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit tests (API layer + store/selectors)
        # src/api/* against a fake Supabase client (tests/api/fakeSupabase.ts),
        # plus the list load-state logic. No network, no real project.
        run: npm test
