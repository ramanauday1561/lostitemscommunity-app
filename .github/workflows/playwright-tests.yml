name: Playwright E2E Tests - Live App

on:
  push:
    branches: [main, claude/**]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DEBUG: 'pw:api,pw:browser,pw:download,pw:launcher'
  ACTIONS_STEP_DEBUG: 'true'

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Create live app config
        run: |
          cat > playwright.live.config.ts << 'EOF'
          import { defineConfig, devices } from '@playwright/test';

          export default defineConfig({
            testDir: './playwright',
            fullyParallel: false,
            forbidOnly: false,
            retries: 0,
            workers: 1,
            reporter: [
              ['html'],
              ['list'],
              ['json', { outputFile: 'test-results.json' }]
            ],
            use: {
              baseURL: 'https://app.lostitemscommunity.com',
              trace: 'on',
              screenshot: 'on',
              video: 'on',
              actionTimeout: 20000,
            },
            projects: [
              {
                name: 'chromium',
                use: {
                  ...devices['Desktop Chrome'],
                  ignoreHTTPSErrors: true,
                },
              },
            ],
            timeout: 60000,
            webServer: undefined,
          });
          EOF

      - name: Run Diagnostic Tests (Verbose)
        run: npx playwright test --config playwright.live.config.ts playwright/diagnostic.spec.ts --reporter=list
        env:
          DEBUG: 'pw:*'
          PWDEBUG: '1'
        continue-on-error: true

      - name: Run Phase 5 Tests (Chat)
        run: npx playwright test --config playwright.live.config.ts playwright/phase5-chat.spec.ts --reporter=list
        env:
          DEBUG: 'pw:*'
          PWDEBUG: '1'
        continue-on-error: true

      - name: Run Phase 6 Tests (Forum)
        run: npx playwright test --config playwright.live.config.ts playwright/phase6-forum.spec.ts --reporter=list
        env:
          DEBUG: 'pw:*'
          PWDEBUG: '1'
        continue-on-error: true

      - name: Run Phase 7 Tests (Moderation)
        run: npx playwright test --config playwright.live.config.ts playwright/phase7-moderation.spec.ts --reporter=list
        env:
          DEBUG: 'pw:*'
          PWDEBUG: '1'
        continue-on-error: true

      - name: Run Phase 11 Tests (Support & FAQ)
        run: npx playwright test --config playwright.live.config.ts playwright/phase11-support.spec.ts --reporter=list
        env:
          DEBUG: 'pw:*'
          PWDEBUG: '1'
        continue-on-error: true

      - name: Run Phase 8 Tests (Members)
        run: npx playwright test --config playwright.live.config.ts playwright/phase8-members.spec.ts --reporter=list
        env:
          DEBUG: 'pw:*'
          PWDEBUG: '1'
        continue-on-error: true

      - name: Show test results JSON
        if: always()
        run: |
          if [ -f test-results.json ]; then
            echo "=== TEST RESULTS JSON ==="
            cat test-results.json | head -100
          fi
        continue-on-error: true

      - name: Show HTML report
        if: always()
        run: |
          if [ -f playwright-report/index.html ]; then
            echo "=== HTML REPORT AVAILABLE ==="
            ls -lah playwright-report/
          fi
        continue-on-error: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
