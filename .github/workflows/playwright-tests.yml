name: Playwright E2E Tests - Live App

on:
  push:
    branches: [main, claude/**]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright
        run: npx playwright install chromium

      - name: Create live app config
        run: |
          cat > playwright.live.config.ts << 'EOF'
          import { defineConfig, devices } from '@playwright/test';

          export default defineConfig({
            testDir: './playwright',
            fullyParallel: false,
            forbidOnly: false,
            retries: 1,
            workers: 1,
            reporter: [
              ['html'],
              ['list']
            ],
            use: {
              baseURL: 'https://app.lostitemscommunity.com',
              trace: 'on',
              screenshot: 'on',
              video: 'on',
              actionTimeout: 15000,
            },
            projects: [
              {
                name: 'chromium',
                use: { ...devices['Desktop Chrome'] },
              },
            ],
            timeout: 60000,
          });
          EOF

      - name: Run Phase 8 Tests
        run: npx playwright test --config playwright.live.config.ts playwright/phase8-members.spec.ts

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
