name: Playwright E2E Tests - Live App

on:
  push:
    branches: [main, claude/**]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  E2E_SUPERADMIN_USERNAME: ${{ secrets.E2E_SUPERADMIN_USERNAME }}
  E2E_SUPERADMIN_PASSWORD: ${{ secrets.E2E_SUPERADMIN_PASSWORD }}
  E2E_USER_USERNAME: ${{ secrets.E2E_USER_USERNAME }}
  E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Create live app config
        run: |
          cat > playwright.live.config.ts << 'EOF'
          import { defineConfig, devices } from '@playwright/test';

          export default defineConfig({
            testDir: './playwright',
            fullyParallel: false,
            forbidOnly: false,
            retries: 0,
            workers: 1,
            reporter: [
              ['html', { open: 'never' }],
              ['list'],
              ['json', { outputFile: 'test-results.json' }]
            ],
            use: {
              baseURL: 'https://app.lostitemscommunity.com',
              trace: 'retain-on-failure',
              screenshot: 'only-on-failure',
              video: 'retain-on-failure',
              actionTimeout: 20000,
            },
            projects: [
              {
                name: 'chromium',
                use: {
                  ...devices['Desktop Chrome'],
                  ignoreHTTPSErrors: true,
                  headless: true,
                },
              },
            ],
            timeout: 60000,
            webServer: undefined,
          });
          EOF

      # Runs every spec in ./playwright. No PWDEBUG/DEBUG: PWDEBUG forces a headed
      # browser, which cannot start in this display-less container. No
      # continue-on-error: a failing test must fail the job.
      - name: Run Playwright tests
        run: npx playwright test --config playwright.live.config.ts

      - name: Show test results JSON
        if: always()
        run: |
          if [ -f test-results.json ]; then
            echo "=== TEST RESULTS JSON ==="
            cat test-results.json | head -100
          fi
        continue-on-error: true

      - name: Show HTML report
        if: always()
        run: |
          if [ -f playwright-report/index.html ]; then
            echo "=== HTML REPORT AVAILABLE ==="
            ls -lah playwright-report/
          fi
        continue-on-error: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
