name: Deploy web to GitHub Pages

# The build runs everywhere so a broken web export is caught early, but the
# github-pages environment only accepts deployments from the default branch --
# attempting to publish from a feature branch is rejected outright.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Scope concurrency per ref so a pull-request build cannot cancel an
# in-flight deployment from main.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Export static web build
        run: npx expo export -p web --output-dir dist
      - name: Prepare for GitHub Pages
        run: |
          touch dist/.nojekyll          # Pages runs Jekyll, which strips _expo/
          cp dist/index.html dist/404.html   # SPA fallback for deep links
          # An Actions deployment replaces the whole site, so the custom domain
          # has to be republished every time or Pages drops back to the
          # github.io subpath.
          echo app.lostitemscommunity.com > dist/CNAME
      # Needs Pages enabled once by hand: Settings -> Pages -> Source: GitHub Actions.
      # The workflow token cannot create the Pages site itself, so this must not
      # block the build.
      - uses: actions/configure-pages@v5
        continue-on-error: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    # Only main may deploy to the github-pages environment.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
