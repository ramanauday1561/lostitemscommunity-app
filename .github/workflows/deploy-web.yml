name: Deploy web app

# The web build is served from https://app.lostitemscommunity.com, which is a
# GitHub Pages site for this repository. Set Settings -> Pages -> Source to
# "GitHub Actions" once; after that every push to main redeploys.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A queued deploy waits for the running one rather than cancelling it, so a
# half-published site is never left behind.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Served from the domain root, so no baseUrl: asset paths stay absolute.
      - name: Export web bundle
        run: npx expo export --platform web --output-dir dist

      - name: Prepare the Pages artifact
        run: |
          # Without this, Jekyll strips the _expo/ directory and the app
          # loads to a blank page.
          touch dist/.nojekyll
          # Pages needs the domain in the artifact as well as in settings,
          # or a redeploy can clear the custom domain.
          echo 'app.lostitemscommunity.com' > dist/CNAME
          # The export is a single-page app: every route is served by
          # index.html. Pages answers unknown paths with 404.html, so making
          # that a copy of index.html lets deep links like /item/LOST-0001
          # resolve instead of 404ing on refresh.
          cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
