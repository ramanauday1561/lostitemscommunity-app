name: Publish update

# Every push to a development branch publishes a new JS bundle to the
# "development" EAS Update branch. The installed dev build picks it up on
# next launch, so testing a change needs no laptop and no rebuild.
on:
  push:
    branches:
      - main
      - 'claude/**'

jobs:
  publish_android_update:
    name: Publish Android update
    type: update
    params:
      branch: development
      platform: android
